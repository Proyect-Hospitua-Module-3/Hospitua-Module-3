# Entorno local de Módulo 3: PostgreSQL y RabbitMQ (feature 010).
# Módulo 1 usa los mismos puertos y las mismas credenciales de RabbitMQ: si ya tienes su
# entorno levantado, Módulo 3 puede usar ese broker y no hace falta levantar el de aquí.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hospitua
      POSTGRES_PASSWORD: hospitua
      POSTGRES_DB: modulo3
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hospitua -d modulo3']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hospitua
      RABBITMQ_DEFAULT_PASS: hospitua
    ports:
      - '5672:5672'
      - '15672:15672' # Interfaz de gestión: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
